<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#152A50" flood-opacity="0.18"/>
    </filter>

    <linearGradient id="oceanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="90%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <linearGradient id="beachSandGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#FEF3C7"/>
      <stop offset="70%" stop-color="#F5EEDB"/>
      <stop offset="100%" stop-color="#ECE5D3"/>
    </linearGradient>

    <linearGradient id="poolCyanLagoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#0EA5E9"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <g id="palmTree">
      <circle cx="0" cy="0" r="14" fill="#047857" opacity="0.15"/>
      <path d="M0,0 Q-15,-20 -24,-10 Q-15,-15 0,0" fill="#059669"/>
      <path d="M0,0 Q0,-26 12,-22 Q5,-16 0,0" fill="#10B981"/>
      <path d="M0,0 Q18,-18 22,-8 Q14,-10 0,0" fill="#059669"/>
      <path d="M0,0 Q15,10 18,20 Q10,12 0,0" fill="#047857"/>
      <path d="M0,0 Q-10,16 -16,22 Q-8,12 0,0" fill="#059669"/>
      <path d="M0,0 Q-22,0 -26,-2 Q-16,-3 0,0" fill="#10B981"/>
      <circle cx="0" cy="0" r="3" fill="#D97706"/>
    </g>

    <g id="beachUmbrella">
      <circle cx="0" cy="0" r="9" fill="#B45309" opacity="0.25"/>
      <circle cx="0" cy="0" r="7.5" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="5.5" fill="#D97706"/>
      <circle cx="0" cy="0" r="2" fill="#78350F"/>
    </g>

    <g id="sunLounger">
      <rect x="-4" y="-8" width="8" height="16" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="-3" y="-7" width="6" height="5" rx="1" fill="#38BDF8"/>
    </g>
  </defs>

  <!-- =========================================================
       1. FONDO GENERAL: MASTERPLAN
       ========================================================= -->
  <rect width="1200" height="750" fill="url(#beachSandGrad)"/>

  <!-- Mar Caribe en la parte inferior -->
  <path d="M0,690 Q300,670 600,685 T1200,680 L1200,750 L0,750 Z" fill="url(#oceanGrad)"/>
  <path d="M0,688 Q300,668 600,683 T1200,678" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75"/>

  <!-- =========================================================
       2. ARQUITECTURA DE EDIFICIOS: TORRES DUNAS (HABITACIONES)
       ========================================================= -->
  <!-- Torre Dunas 1 (Ala Izquierda) -->
  <g transform="translate(180, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="75" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="8" y="8" width="164" height="59" rx="6" fill="#F8FAFC"/>
    <!-- Módulos de Balcones / Habitaciones -->
    <line x1="45" y1="8" x2="45" y2="67" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="90" y1="8" x2="90" y2="67" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="135" y1="8" x2="135" y2="67" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="-12" width="150" height="20" rx="10" fill="#22417C"/>
    <text x="90" y="2" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" text-anchor="middle">TORRE DUNAS 1 &bull; SUITES</text>
  </g>

  <!-- Torre Dunas 2 (Lobby Central & Recepción) -->
  <g transform="translate(420, 50)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="95" rx="12" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2.5"/>
    <rect x="8" y="8" width="204" height="79" rx="8" fill="#FDFBF7"/>
    <circle cx="110" cy="45" r="25" fill="rgba(212, 175, 55, 0.12)"/>
    <text x="110" y="42" fill="#152A50" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="12" text-anchor="middle">LOBBY PRINCIPAL</text>
    <text x="110" y="58" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" text-anchor="middle" letter-spacing="1">RECEPCIÓN &amp; CONSERJERÍA</text>
  </g>

  <!-- Torre Dunas 3 (Ala Derecha) -->
  <g transform="translate(700, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="180" height="75" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="8" y="8" width="164" height="59" rx="6" fill="#F8FAFC"/>
    <line x1="45" y1="8" x2="45" y2="67" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="90" y1="8" x2="90" y2="67" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="135" y1="8" x2="135" y2="67" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="-12" width="150" height="20" rx="10" fill="#22417C"/>
    <text x="90" y="2" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" text-anchor="middle">TORRE DUNAS 2 &bull; HABITACIONES</text>
  </g>

  <!-- =========================================================
       3. COMPLEJO MONUMENTAL DE PISCINAS LAGOON (CENTRO)
       ========================================================= -->
  <g transform="translate(250, 180)" filter="url(#cardShadow)">
    <!-- Solárium / Terraza de mármol coralino -->
    <path d="M40,50 Q280,10 580,40 Q680,140 640,320 Q480,380 280,360 Q60,330 30,220 Q10,120 40,50 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
    
    <!-- Vaso de la Laguna de Agua Turquesa -->
    <path d="M60,70 Q280,30 560,60 Q650,150 610,300 Q460,350 280,335 Q85,310 55,200 Q40,130 60,70 Z" fill="url(#poolCyanLagoon)" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Isla Central Tropical con Palmeras dentro de la Piscina -->
    <g transform="translate(300, 170)">
      <ellipse cx="40" cy="30" rx="48" ry="32" fill="#FEF08A" stroke="#E2E8F0" stroke-width="2"/>
      <ellipse cx="40" cy="30" rx="40" ry="25" fill="#86EFAC"/>
      <use href="#palmTree" x="25" y="25"/>
      <use href="#palmTree" x="55" y="32"/>
      <!-- Puente de Madera a la Isla -->
      <line x1="-8" y1="30" x2="0" y2="30" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
      <line x1="80" y1="30" x2="95" y2="30" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Swim-up Aqua Bar (Bar Húmedo en la Piscina) -->
    <g transform="translate(480, 120)">
      <circle cx="28" cy="28" r="28" fill="#78350F" opacity="0.3"/>
      <circle cx="28" cy="28" r="24" fill="#92400E" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#D97706"/>
      <rect x="-8" y="58" width="72" height="16" rx="4" fill="#152A50"/>
      <text x="28" y="69" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" text-anchor="middle">AQUA BAR DUNAS</text>
    </g>

    <!-- Área Splash Infantil con Toboganes de Agua -->
    <g transform="translate(100, 100)">
      <circle cx="35" cy="35" r="32" fill="#BAE6FD" stroke="#38BDF8" stroke-width="2"/>
      <path d="M15,35 Q35,15 55,35" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
      <rect x="5" y="70" width="60" height="16" rx="4" fill="#0284C7"/>
      <text x="35" y="81" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7" text-anchor="middle">SPLASH KIDS</text>
    </g>

    <!-- Tumbonas y Sombrillas alrededor del solárium -->
    <use href="#sunLounger" x="140" y="40"/>
    <use href="#sunLounger" x="160" y="40"/>
    <use href="#sunLounger" x="180" y="40"/>
    <use href="#beachUmbrella" x="200" y="38"/>
    <use href="#sunLounger" x="420" y="48"/>
    <use href="#sunLounger" x="440" y="48"/>

    <use href="#sunLounger" x="120" y="340"/>
    <use href="#sunLounger" x="140" y="340"/>
    <use href="#beachUmbrella" x="160" y="340"/>
    <use href="#sunLounger" x="400" y="360"/>
    <use href="#sunLounger" x="420" y="360"/>
    <use href="#beachUmbrella" x="440" y="360"/>

    <!-- Rótulo Central -->
    <rect x="220" y="270" width="160" height="24" rx="12" fill="rgba(34, 65, 124, 0.9)" filter="url(#cardShadow)"/>
    <text x="300" y="286" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1">PISCINA PRINCIPAL DUNAS</text>
  </g>

  <!-- =========================================================
       4. RESTAURANTE BUFFET & TEATRINO SHOWS
       ========================================================= -->
  <!-- Restaurante Buffet Principal "Los Cocos" (Izquierda) -->
  <g transform="translate(90, 240)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="140" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="6" y="6" width="128" height="78" rx="8" fill="#F8FAFC"/>
    <circle cx="70" cy="38" r="18" fill="rgba(34, 65, 124, 0.08)"/>
    <path d="M62,38 L78,38 M70,30 L70,46" stroke="#22417C" stroke-width="2"/>
    <text x="70" y="62" fill="#152A50" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="11" text-anchor="middle">REST. LOS COCOS</text>
    <text x="70" y="74" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7.5" text-anchor="middle">BUFFET INTERNACIONAL</text>
  </g>

  <!-- Anfiteatro / Teatrino de Shows Nocturnos (Derecha) -->
  <g transform="translate(950, 240)" filter="url(#cardShadow)">
    <path d="M10,80 A65,65 0 0,1 130,80 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <!-- Gradas semicirculares -->
    <path d="M22,75 A50,50 0 0,1 118,75" fill="none" stroke="#E2E8F0" stroke-width="6"/>
    <path d="M34,70 A35,35 0 0,1 106,70" fill="none" stroke="#E2E8F0" stroke-width="6"/>
    <!-- Escenario -->
    <circle cx="70" cy="78" r="10" fill="#22417C"/>
    <rect x="15" y="90" width="110" height="18" rx="4" fill="#152A50"/>
    <text x="70" y="102" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" text-anchor="middle">TEATRINO &amp; SHOWS</text>
  </g>

  <!-- =========================================================
       5. PASARELA DE MADERA HACIA PLAYA PUERTO CRUZ
       ========================================================= -->
  <g transform="translate(540, 560)">
    <!-- Pasarela de madera rústica elevada sobre las dunas -->
    <rect x="0" y="0" width="40" height="120" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
    <!-- Tablones -->
    <line x1="0" y1="20" x2="40" y2="20" stroke="#78350F" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#78350F" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="40" y2="60" stroke="#78350F" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="40" y2="80" stroke="#78350F" stroke-width="1.5"/>
    <line x1="0" y1="100" x2="40" y2="100" stroke="#78350F" stroke-width="1.5"/>
    <!-- Rótulo -->
    <rect x="-35" y="50" width="110" height="18" rx="9" fill="#22417C" filter="url(#cardShadow)"/>
    <text x="20" y="62" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" text-anchor="middle">ACCESO PLAYA</text>
  </g>

  <!-- Sombrillas en la Playa -->
  <g transform="translate(180, 600)">
    <use href="#beachUmbrella" x="0" y="0"/>
    <use href="#beachUmbrella" x="35" y="0"/>
    <use href="#beachUmbrella" x="70" y="0"/>
    <use href="#beachUmbrella" x="105" y="0"/>
    <use href="#beachUmbrella" x="140" y="0"/>
    <use href="#beachUmbrella" x="175" y="0"/>
    <use href="#beachUmbrella" x="210" y="0"/>
    <use href="#beachUmbrella" x="245" y="0"/>
  </g>
  <g transform="translate(680, 600)">
    <use href="#beachUmbrella" x="0" y="0"/>
    <use href="#beachUmbrella" x="35" y="0"/>
    <use href="#beachUmbrella" x="70" y="0"/>
    <use href="#beachUmbrella" x="105" y="0"/>
    <use href="#beachUmbrella" x="140" y="0"/>
    <use href="#beachUmbrella" x="175" y="0"/>
    <use href="#beachUmbrella" x="210" y="0"/>
    <use href="#beachUmbrella" x="245" y="0"/>
  </g>

  <!-- Palmeras de Jardinería Paisajística -->
  <use href="#palmTree" x="150" y="160"/>
  <use href="#palmTree" x="180" y="210"/>
  <use href="#palmTree" x="140" y="370"/>
  <use href="#palmTree" x="170" y="430"/>

  <use href="#palmTree" x="980" y="160"/>
  <use href="#palmTree" x="1020" y="210"/>
  <use href="#palmTree" x="970" y="370"/>
  <use href="#palmTree" x="1010" y="430"/>

  <!-- Logo Banner Oficial Área Dunas -->
  <g transform="translate(450, 690)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="300" height="42" rx="21" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="150" y="26" fill="#152A50" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="2">SUNSOL ECOLAND &bull; ÁREA DUNAS</text>
  </g>

  <!-- Rosa de los vientos -->
  <g transform="translate(80, 80)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="#F8FAFC"/>
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#D4AF37"/>
    <polygon points="0,18 5,0 0,4 -5,0" fill="#22417C"/>
    <polygon points="18,0 0,5 4,0 0,-5" fill="#64748B"/>
    <polygon points="-18,0 0,5 -4,0 0,-5" fill="#64748B"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
    <text x="0" y="-8" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="6.5" text-anchor="middle">N</text>
  </g>
</svg>
