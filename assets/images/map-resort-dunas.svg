<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#0F1E36;">
  <defs>
    <linearGradient id="grassGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B381C" />
      <stop offset="60%" stop-color="#285022" />
      <stop offset="100%" stop-color="#20431D" />
    </linearGradient>

    <linearGradient id="poolGradDunas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="sandGradDunas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2C997" />
      <stop offset="100%" stop-color="#F5E8C7" />
    </linearGradient>

    <linearGradient id="roofTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <linearGradient id="roofNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="plazaTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="shadowFilterDunas" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0B132B" flood-opacity="0.38"/>
    </filter>

    <filter id="glowPoolDunas" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ==================== BASE DEL TERRENO ==================== -->
  <rect width="1200" height="750" fill="url(#grassGrad2)"/>

  <!-- Franja de Playa Sur hacia el mar -->
  <path d="M0,640 C300,620 600,650 900,630 L1200,645 L1200,750 L0,750 Z" fill="url(#sandGradDunas)"/>
  <path d="M0,695 C300,680 600,705 900,685 L1200,695 L1200,750 L0,750 Z" fill="#0284C7" opacity="0.9"/>
  <path d="M0,695 C300,680 600,705 900,685 L1200,695" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8" stroke-dasharray="8 6"/>

  <!-- ==================== PLAZA CENTRAL & CAMINERÍAS ==================== -->
  <g stroke="#D4C29A" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Eje vertical principal -->
    <path d="M600,60 L600,640"/>
    <!-- Ramal a Villas Norte -->
    <path d="M250,150 L950,150"/>
    <path d="M250,260 L950,260"/>
    <!-- Acceso a piscinas y lobby -->
    <path d="M320,440 L880,440"/>
    <path d="M220,530 C350,510 500,530 600,530 C750,530 900,510 1000,530"/>
  </g>

  <!-- Plaza adoquinada central frente al Lobby -->
  <g filter="url(#shadowFilterDunas)">
    <circle cx="600" cy="380" r="48" fill="url(#plazaTile)" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="600" cy="380" r="28" fill="#F8FAFC"/>
    <!-- Fuente central -->
    <circle cx="600" cy="380" r="14" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    <circle cx="600" cy="380" r="5" fill="#FFFFFF"/>
  </g>

  <!-- ==================== VILLAS DUNAS (D01 A D33 - NORTE) ==================== -->
  <!-- Manzana de Villas Oeste (D01 - D16) -->
  <g id="villaClusterWest" filter="url(#shadowFilterDunas)">
    <!-- Fila 1 -->
    <rect x="220" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="280" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="340" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="400" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="460" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>

    <!-- Fila 2 -->
    <rect x="220" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="280" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="340" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="400" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="460" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
  </g>

  <!-- Manzana de Villas Este (D17 - D33) -->
  <g id="villaClusterEast" filter="url(#shadowFilterDunas)">
    <!-- Fila 1 -->
    <rect x="690" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="750" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="810" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="870" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="930" y="90" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>

    <!-- Fila 2 -->
    <rect x="690" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="750" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="810" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="870" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
    <rect x="930" y="190" width="45" height="38" rx="4" fill="url(#roofTerracotta)" stroke="#7F1D1D" stroke-width="1.5"/>
  </g>
  <text x="360" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" text-anchor="middle">VILLAS DUNAS D01 - D16</text>
  <text x="830" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" text-anchor="middle">VILLAS DUNAS D17 - D33</text>

  <!-- ==================== EDIFICIOS CENTRALES: LOBBY & SPORT BAR ==================== -->
  <!-- Gran Lobby Central Dunas -->
  <g filter="url(#shadowFilterDunas)">
    <rect x="520" y="270" width="160" height="75" rx="8" fill="url(#roofNavy)" stroke="#D4AF37" stroke-width="2.5"/>
    <!-- Pórtico de entrada colonial -->
    <polygon points="510,270 600,240 690,270" fill="#1E40AF" stroke="#D4AF37" stroke-width="2"/>
    <rect x="575" y="325" width="50" height="20" rx="3" fill="#D4AF37"/>
    <text x="600" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#0F172A" text-anchor="middle">ENTRADA</text>
  </g>
  <text x="600" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">LOBBY DUNAS &amp; SPORT BAR</text>

  <!-- Gran Teatro & Cinema (Oeste) -->
  <g filter="url(#shadowFilterDunas)">
    <rect x="340" y="310" width="140" height="85" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <polygon points="340,310 410,285 480,310" fill="#334155"/>
    <circle cx="410" cy="350" r="14" fill="#D4AF37"/>
    <text x="410" y="354" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle">&#9733;</text>
  </g>
  <text x="410" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">TEATRO SHOWS &amp; CINE</text>

  <!-- Restaurante Buffet Cachama (Este) -->
  <g filter="url(#shadowFilterDunas)">
    <rect x="720" y="310" width="160" height="85" rx="8" fill="url(#roofNavy)" stroke="#D4AF37" stroke-width="2"/>
    <polygon points="720,310 800,285 880,310" fill="#1E3A8A"/>
    <!-- Patios y terrazas de show-cooking -->
    <rect x="730" y="375" width="140" height="20" rx="4" fill="#D97706" opacity="0.9"/>
  </g>
  <text x="800" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">BUFFET CACHAMA</text>
  <text x="800" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">SHOW COOKING &amp; TERRAZA</text>

  <!-- ==================== PISCINAS DUNAS (SUR / FRENTE AL MAR) ==================== -->
  <!-- Gran Piscina Olímpica y Espejo de Agua Dunas -->
  <g filter="url(#glowPoolDunas)">
    <!-- Borde de piedra solárium -->
    <path d="M190,520 C230,450 420,440 500,490 C560,530 640,460 760,470 C880,480 940,560 880,630 C800,710 400,670 230,640 C170,620 160,560 190,520 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="4"/>
    <!-- Vaso de agua turquesa cristalina -->
    <path d="M200,525 C238,458 412,448 492,496 C552,534 642,468 752,478 C868,488 926,564 868,624 C792,698 408,662 240,634 C182,614 172,562 200,525 Z" fill="url(#poolGradDunas)"/>
    <!-- Reflejos de agua -->
    <path d="M260,530 Q380,500 480,540" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <path d="M300,580 Q450,550 600,600" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <path d="M550,520 Q680,490 800,540" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <path d="M620,590 Q720,560 820,610" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>

    <!-- Bar Acuático "Aqua Bar Olímpica" sumergido -->
    <circle cx="340" cy="540" r="18" fill="#0369A1" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="340" cy="540" r="10" fill="#38BDF8"/>
    <text x="340" y="543" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">AQUA BAR</text>
  </g>
  <text x="540" y="620" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PISCINA CENTRAL ECO ESPEJO</text>

  <!-- Piscina Honguito Kids (Suroeste) -->
  <g filter="url(#glowPoolDunas)">
    <circle cx="120" cy="560" r="42" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="120" cy="560" r="37" fill="url(#poolGradDunas)"/>
    <!-- Hongo aspersor infantil -->
    <circle cx="120" cy="560" r="12" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="120" cy="560" r="4" fill="#FFFFFF"/>
  </g>
  <text x="120" y="510" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#7DD3FC" text-anchor="middle">PISCINA HONGUITO</text>

  <!-- Camastros y Tumbonas alrededor de la piscina -->
  <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" opacity="0.85">
    <rect x="230" y="475" width="8" height="14" rx="2"/>
    <rect x="245" y="475" width="8" height="14" rx="2"/>
    <rect x="260" y="475" width="8" height="14" rx="2"/>
    <rect x="275" y="475" width="8" height="14" rx="2"/>
    <rect x="740" y="445" width="8" height="14" rx="2"/>
    <rect x="755" y="445" width="8" height="14" rx="2"/>
    <rect x="770" y="445" width="8" height="14" rx="2"/>
    <rect x="785" y="445" width="8" height="14" rx="2"/>
  </g>

  <!-- ==================== PALMERAS Y JARDINES ==================== -->
  <g id="palmDunas">
    <ellipse cx="5" cy="5" rx="14" ry="10" fill="#0B1C10" opacity="0.35"/>
    <circle cx="0" cy="0" r="4" fill="#78350F"/>
    <path d="M0,0 Q-15,-18 -26,-15 Q-15,-10 0,0" fill="#22C55E"/>
    <path d="M0,0 Q-2,-24 0,-30 Q6,-22 0,0" fill="#16A34A"/>
    <path d="M0,0 Q18,-18 28,-14 Q16,-8 0,0" fill="#22C55E"/>
    <path d="M0,0 Q24,-2 30,8 Q18,8 0,0" fill="#15803D"/>
    <path d="M0,0 Q16,18 20,28 Q10,18 0,0" fill="#22C55E"/>
    <path d="M0,0 Q-4,24 -8,30 Q-6,18 0,0" fill="#16A34A"/>
    <path d="M0,0 Q-22,14 -30,16 Q-18,6 0,0" fill="#15803D"/>
  </g>

  <use href="#palmDunas" x="150" y="140"/>
  <use href="#palmDunas" x="530" y="140" transform="scale(0.85)"/>
  <use href="#palmDunas" x="650" y="140"/>
  <use href="#palmDunas" x="1010" y="140"/>
  <use href="#palmDunas" x="150" y="240" transform="scale(1.1)"/>
  <use href="#palmDunas" x="530" y="240"/>
  <use href="#palmDunas" x="650" y="240"/>
  <use href="#palmDunas" x="1010" y="240" transform="scale(0.9)"/>
  <use href="#palmDunas" x="290" y="360"/>
  <use href="#palmDunas" x="500" y="380"/>
  <use href="#palmDunas" x="700" y="380" transform="scale(1.1)"/>
  <use href="#palmDunas" x="910" y="360"/>
  <use href="#palmDunas" x="90" y="470"/>
  <use href="#palmDunas" x="970" y="520"/>
  <use href="#palmDunas" x="1050" y="600" transform="scale(1.2)"/>
  <use href="#palmDunas" x="60" y="650"/>

  <!-- ==================== ROTULACIÓN Y BRÚJULA ==================== -->
  <g transform="translate(60, 60)" filter="url(#shadowFilterDunas)">
    <circle cx="0" cy="0" r="26" fill="#0F172A" stroke="#D4AF37" stroke-width="2"/>
    <polygon points="0,-18 4,0 -4,0" fill="#EF4444"/>
    <polygon points="0,18 4,0 -4,0" fill="#CBD5E1"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">N</text>
  </g>

  <!-- Banner Oficial Superior -->
  <g transform="translate(600, 32)" filter="url(#shadowFilterDunas)">
    <rect x="-230" y="-18" width="460" height="36" rx="18" fill="#152A50" stroke="#D4AF37" stroke-width="2"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      SUNSOL ECOLAND &bull; ÁREA DUNAS &amp; PISCINAS
    </text>
  </g>
</svg>
