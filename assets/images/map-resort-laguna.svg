<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#152A50" flood-opacity="0.18"/>
    </filter>

    <linearGradient id="lagoonWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#0369A1"/>
      <stop offset="80%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <linearGradient id="mangroveGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>

    <linearGradient id="beachSandGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#FEF3C7"/>
      <stop offset="70%" stop-color="#F5EEDB"/>
      <stop offset="100%" stop-color="#ECE5D3"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <g id="palmTree">
      <circle cx="0" cy="0" r="14" fill="#047857" opacity="0.15"/>
      <path d="M0,0 Q-15,-20 -24,-10 Q-15,-15 0,0" fill="#059669"/>
      <path d="M0,0 Q0,-26 12,-22 Q5,-16 0,0" fill="#10B981"/>
      <path d="M0,0 Q18,-18 22,-8 Q14,-10 0,0" fill="#059669"/>
      <path d="M0,0 Q15,10 18,20 Q10,12 0,0" fill="#047857"/>
      <path d="M0,0 Q-10,16 -16,22 Q-8,12 0,0" fill="#059669"/>
      <path d="M0,0 Q-22,0 -26,-2 Q-16,-3 0,0" fill="#10B981"/>
      <circle cx="0" cy="0" r="3" fill="#D97706"/>
    </g>

    <g id="kayakBoat">
      <path d="M-15,0 Q0,-4 15,0 Q0,4 -15,0 Z" fill="#EF4444"/>
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- =========================================================
       1. FONDO GENERAL: JARDINES & ECOSISTEMA LAGUNA
       ========================================================= -->
  <rect width="1200" height="750" fill="url(#beachSandGrad)"/>

  <!-- Colinas verdes al fondo (Norte) -->
  <path d="M0,80 Q250,20 500,60 T1000,40 Q1100,50 1200,80 L1200,0 L0,0 Z" fill="#D1FAE5" opacity="0.6"/>

  <!-- =========================================================
       2. CUERPO DE AGUA PRINCIPAL: LA LAGUNA NATURAL
       ========================================================= -->
  <path d="M120,180 Q350,110 700,140 Q980,180 1100,280 Q1180,440 1020,580 Q800,680 480,640 Q220,610 100,480 Q40,320 120,180 Z" fill="url(#lagoonWater)" stroke="#7DD3FC" stroke-width="4" filter="url(#cardShadow)"/>

  <!-- Ondulaciones suaves en la laguna -->
  <path d="M250,260 Q380,240 500,270" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.5"/>
  <path d="M620,320 Q740,300 860,330" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.5"/>
  <path d="M380,420 Q500,400 640,430" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.5"/>
  <path d="M500,520 Q650,490 800,525" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.5"/>

  <!-- Isla de Manglar Natural protegida en el centro -->
  <g transform="translate(560, 340)" filter="url(#cardShadow)">
    <ellipse cx="60" cy="40" rx="90" ry="50" fill="url(#mangroveGreen)"/>
    <ellipse cx="60" cy="40" rx="75" ry="38" fill="#15803D"/>
    <!-- Palmeras e iconos de mangle -->
    <use href="#palmTree" x="30" y="30"/>
    <use href="#palmTree" x="65" y="25"/>
    <use href="#palmTree" x="90" y="45"/>
    <use href="#palmTree" x="45" y="55"/>
    <rect x="0" y="28" width="120" height="18" rx="9" fill="rgba(21, 42, 80, 0.85)"/>
    <text x="60" y="40" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" text-anchor="middle">SANTUARIO DE AVES</text>
  </g>

  <!-- =========================================================
       3. MUELLES Y EMBARCADEROS DE KAYAK
       ========================================================= -->
  <!-- Embarcadero Náutico de Madera -->
  <g transform="translate(240, 480)" filter="url(#cardShadow)">
    <!-- Pasarela que entra a la laguna -->
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#92400E" stroke="#78350F" stroke-width="2" transform="rotate(-30 0 0)"/>
    <rect x="100" y="-70" width="40" height="60" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
    <!-- Kayaks amarrados al muelle -->
    <use href="#kayakBoat" x="90" y="-45"/>
    <use href="#kayakBoat" x="90" y="-25"/>
    <use href="#kayakBoat" x="150" y="-45"/>
    <use href="#kayakBoat" x="150" y="-25"/>
    <!-- Rótulo -->
    <rect x="25" y="-100" width="130" height="22" rx="11" fill="#22417C"/>
    <text x="90" y="-86" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" text-anchor="middle">EMBARCADERO DE KAYAKS</text>
  </g>

  <!-- Kayaks navegando en la laguna -->
  <use href="#kayakBoat" x="420" y="290"/>
  <use href="#kayakBoat" x="820" y="460"/>

  <!-- =========================================================
       4. BUNGALOWS Y SUITES FRENTE A LA LAGUNA (ORILLA SUR)
       ========================================================= -->
  <!-- Complejo de Cabañas y Bungalows Ecológicos -->
  <g transform="translate(140, 580)" filter="url(#cardShadow)">
    <!-- Cabaña 1 -->
    <rect x="0" y="0" width="75" height="55" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="4" y="4" width="67" height="47" rx="6" fill="#F8FAFC"/>
    <text x="37.5" y="28" fill="#152A50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" text-anchor="middle">BUNGALOW 1</text>
    <text x="37.5" y="42" fill="#0284C7" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7" text-anchor="middle">VISTA LAGUNA</text>
    <!-- Cabaña 2 -->
    <rect x="95" y="0" width="75" height="55" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="99" y="4" width="67" height="47" rx="6" fill="#F8FAFC"/>
    <text x="132.5" y="28" fill="#152A50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" text-anchor="middle">BUNGALOW 2</text>
    <text x="132.5" y="42" fill="#0284C7" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7" text-anchor="middle">VISTA LAGUNA</text>
    <!-- Cabaña 3 -->
    <rect x="190" y="0" width="75" height="55" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="194" y="4" width="67" height="47" rx="6" fill="#F8FAFC"/>
    <text x="227.5" y="28" fill="#152A50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" text-anchor="middle">BUNGALOW 3</text>
    <text x="227.5" y="42" fill="#0284C7" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7" text-anchor="middle">VISTA LAGUNA</text>
  </g>

  <!-- =========================================================
       5. MIRADOR DEL ATARDECER & SENDERO DEPORTIVO
       ========================================================= -->
  <!-- Mirador Deck Sunset (Orilla estáe) -->
  <g transform="translate(980, 360)" filter="url(#cardShadow)">
    <circle cx="45" cy="45" r="44" fill="#D4AF37" opacity="0.25"/>
    <circle cx="45" cy="45" r="38" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2.5"/>
    <!-- Pérgola octogonal -->
    <polygon points="45,15 65,22 75,45 65,68 45,75 25,68 15,45 25,22" fill="#FDFBF7" stroke="#92400E" stroke-width="2"/>
    <circle cx="45" cy="45" r="6" fill="#D4AF37"/>
    <!-- Rótulo -->
    <rect x="-15" y="94" width="120" height="20" rx="10" fill="#152A50"/>
    <text x="45" y="108" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" text-anchor="middle">MIRADOR SUNSET DECK</text>
  </g>

  <!-- Sendero Peatonal Ecológico bordeando la laguna -->
  <path d="M80,520 Q200,680 500,700 Q800,720 1050,620 Q1180,500 1120,300" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-dasharray="12 6" opacity="0.8"/>
  <rect x="520" y="690" width="160" height="20" rx="10" fill="#14532D" filter="url(#cardShadow)"/>
  <text x="600" y="703" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" text-anchor="middle">SENDERO ECOLÓGICO &amp; RUNNING</text>

  <!-- Palmeras y Mangle -->
  <use href="#palmTree" x="120" y="120"/>
  <use href="#palmTree" x="160" y="90"/>
  <use href="#palmTree" x="220" y="110"/>
  <use href="#palmTree" x="80" y="240"/>
  <use href="#palmTree" x="60" y="380"/>

  <use href="#palmTree" x="1060" y="180"/>
  <use href="#palmTree" x="1120" y="240"/>
  <use href="#palmTree" x="1080" y="480"/>
  <use href="#palmTree" x="1020" y="540"/>

  <!-- Logo Banner Oficial Área Laguna -->
  <g transform="translate(450, 40)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="300" height="42" rx="21" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="150" y="26" fill="#152A50" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="2">SUNSOL ECOLAND &#8226; ÁREA LAGUNA</text>
  </g>

  <!-- Rosa de los vientos -->
  <g transform="translate(80, 80)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="#F8FAFC"/>
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#D4AF37"/>
    <polygon points="0,18 5,0 0,4 -5,0" fill="#22417C"/>
    <polygon points="18,0 0,5 4,0 0,-5" fill="#64748B"/>
    <polygon points="-18,0 0,5 -4,0 0,-5" fill="#64748B"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
    <text x="0" y="-8" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="6.5" text-anchor="middle">N</text>
  </g>
</svg>
