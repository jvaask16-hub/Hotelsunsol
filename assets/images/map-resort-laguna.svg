<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#0F1E36;">
  <defs>
    <linearGradient id="grassGradLaguna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14361C" />
      <stop offset="60%" stop-color="#204E27" />
      <stop offset="100%" stop-color="#194020" />
    </linearGradient>

    <linearGradient id="lagunaWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="woodDock" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="roofNavyLaguna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="poolGradLaguna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="shadowFilterLaguna" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0B132B" flood-opacity="0.38"/>
    </filter>

    <filter id="glowLaguna" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ==================== BASE DEL TERRENO ==================== -->
  <rect width="1200" height="750" fill="url(#grassGradLaguna)"/>

  <!-- ==================== GRAN LAGUNA NATURAL DE MANGLARES ==================== -->
  <g filter="url(#glowLaguna)">
    <!-- Orilla de arena y piedras -->
    <path d="M120,400 C80,260 220,120 460,90 C700,60 1020,140 1080,300 C1140,460 980,620 740,650 C500,680 160,540 120,400 Z" fill="#D4AF37" opacity="0.3"/>
    <!-- Cuerpo de agua navegable -->
    <path d="M130,400 C90,270 230,130 460,100 C690,70 1010,150 1070,300 C1130,450 970,610 740,640 C510,670 170,530 130,400 Z" fill="url(#lagunaWater)"/>
    <!-- Ondas de agua cristalina y corrientes suaves -->
    <path d="M220,280 Q340,240 480,280 T720,260" fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.5"/>
    <path d="M300,380 Q450,330 600,390 T900,360" fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.5"/>
    <path d="M250,470 Q420,430 580,480 T840,460" fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Islote Central Ecológico de Manglar -->
  <g filter="url(#shadowFilterLaguna)">
    <path d="M520,320 C560,280 660,290 690,340 C720,390 650,440 580,430 C510,420 480,360 520,320 Z" fill="#064E3B" stroke="#047857" stroke-width="2"/>
    <!-- Árboles de mangle sobre el islote -->
    <circle cx="560" cy="340" r="22" fill="#059669" opacity="0.9"/>
    <circle cx="610" cy="330" r="26" fill="#10B981" opacity="0.9"/>
    <circle cx="650" cy="360" r="24" fill="#047857" opacity="0.9"/>
    <circle cx="590" cy="390" r="25" fill="#10B981" opacity="0.9"/>
    <circle cx="540" cy="380" r="20" fill="#059669" opacity="0.9"/>
  </g>
  <text x="600" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">RESERVA MANGLAR</text>

  <!-- ==================== PASARELAS DE MADERA & MUELLES ==================== -->
  <!-- Sendero ecológico / Deck flotante -->
  <g filter="url(#shadowFilterLaguna)">
    <!-- Muelle Norte a Kayaks -->
    <path d="M480,100 L480,220 L580,220" fill="none" stroke="url(#woodDock)" stroke-width="12" stroke-linecap="round"/>
    <rect x="560" y="200" width="45" height="40" rx="4" fill="url(#woodDock)"/>
    <!-- Botes de remo y kayaks atracados -->
    <ellipse cx="575" cy="190" rx="14" ry="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
    <ellipse cx="575" cy="250" rx="14" ry="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1"/>
    <ellipse cx="615" cy="210" rx="6" ry="14" fill="#EF4444" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Pasarela periférica Este -->
    <path d="M960,220 C1020,320 1020,440 940,540" fill="none" stroke="url(#woodDock)" stroke-width="10" stroke-linecap="round"/>
    <!-- Mirador de Aves sobre el agua -->
    <circle cx="1000" cy="380" r="24" fill="url(#woodDock)" stroke="#FDE68A" stroke-width="2"/>
  </g>
  <text x="530" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FDE68A" text-anchor="middle">MUELLE KAYAKS</text>
  <text x="1000" y="384" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">MIRADOR AVES</text>

  <!-- Caminerías de Piedra perimetrales -->
  <g stroke="#D4C29A" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M60,200 L240,160 L480,100 L760,80 L1040,120"/>
    <path d="M60,540 L180,590 L400,660 L740,680 L1060,600"/>
    <path d="M240,160 C180,300 180,450 240,560"/>
  </g>

  <!-- ==================== RESTAURANTE LAGUNA GRILL (SUR) ==================== -->
  <g filter="url(#shadowFilterLaguna)">
    <!-- Muelle sobre el agua -->
    <rect x="360" y="580" width="160" height="70" rx="8" fill="url(#woodDock)" stroke="#FDE68A" stroke-width="2"/>
    <!-- Churuata principal -->
    <circle cx="440" cy="615" r="32" fill="#78350F" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="440" cy="615" r="22" fill="#B45309"/>
    <circle cx="440" cy="615" r="10" fill="#D97706"/>
    <!-- Mesas de terraza -->
    <circle cx="380" cy="600" r="6" fill="#FFFFFF"/>
    <circle cx="380" cy="630" r="6" fill="#FFFFFF"/>
    <circle cx="500" cy="600" r="6" fill="#FFFFFF"/>
    <circle cx="500" cy="630" r="6" fill="#FFFFFF"/>
  </g>
  <text x="440" y="665" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">RESTAURANTE LAGUNA GRILL</text>

  <!-- ==================== PISCINAS LAGUNA (SUROESTE) ==================== -->
  <g filter="url(#shadowFilterLaguna)">
    <path d="M120,460 C160,420 220,440 240,490 C260,540 200,600 150,580 C100,560 90,500 120,460 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M126,465 C162,428 216,446 234,492 C252,538 196,592 150,574 C106,556 96,502 126,465 Z" fill="url(#poolGradLaguna)"/>
    <circle cx="170" cy="510" r="12" fill="#38BDF8"/>
  </g>
  <text x="175" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#7DD3FC" text-anchor="middle">PISCINA LAGUNA</text>

  <!-- ==================== HABITACIONES & SUITES LAGUNA (NORTE & OESTE) ==================== -->
  <!-- Módulo de Suites Laguna 1 -->
  <g filter="url(#shadowFilterLaguna)">
    <rect x="250" y="70" width="130" height="60" rx="6" fill="url(#roofNavyLaguna)" stroke="#D4AF37" stroke-width="2"/>
    <line x1="315" y1="70" x2="315" y2="130" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Balcones con vista al agua -->
    <rect x="255" y="125" width="120" height="8" rx="2" fill="#D4AF37"/>
  </g>
  <text x="315" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">SUITES LAGUNA 101-120</text>

  <!-- Módulo de Suites Laguna 2 -->
  <g filter="url(#shadowFilterLaguna)">
    <rect x="730" y="70" width="130" height="60" rx="6" fill="url(#roofNavyLaguna)" stroke="#D4AF37" stroke-width="2"/>
    <line x1="795" y1="70" x2="795" y2="130" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="735" y="125" width="120" height="8" rx="2" fill="#D4AF37"/>
  </g>
  <text x="795" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">SUITES LAGUNA 201-220</text>

  <!-- Mirador del Atardecer (Torre Panorámica Este) -->
  <g filter="url(#shadowFilterLaguna)">
    <rect x="1080" y="240" width="50" height="50" rx="8" fill="#1E293B" stroke="#D4AF37" stroke-width="2.5"/>
    <polygon points="1070,240 1105,210 1140,240" fill="#D4AF37"/>
    <circle cx="1105" cy="265" r="12" fill="#F59E0B"/>
  </g>
  <text x="1105" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FEF08A" text-anchor="middle">MIRADOR ATARDECER</text>

  <!-- ==================== PALMERAS Y FLORA DE MANGLAR ==================== -->
  <g id="palmTreeLaguna">
    <ellipse cx="5" cy="5" rx="14" ry="10" fill="#0B1C10" opacity="0.35"/>
    <circle cx="0" cy="0" r="4" fill="#78350F"/>
    <path d="M0,0 Q-15,-18 -26,-15 Q-15,-10 0,0" fill="#22C55E"/>
    <path d="M0,0 Q-2,-24 0,-30 Q6,-22 0,0" fill="#16A34A"/>
    <path d="M0,0 Q18,-18 28,-14 Q16,-8 0,0" fill="#22C55E"/>
    <path d="M0,0 Q24,-2 30,8 Q18,8 0,0" fill="#15803D"/>
    <path d="M0,0 Q16,18 20,28 Q10,18 0,0" fill="#22C55E"/>
    <path d="M0,0 Q-4,24 -8,30 Q-6,18 0,0" fill="#16A34A"/>
    <path d="M0,0 Q-22,14 -30,16 Q-18,6 0,0" fill="#15803D"/>
  </g>

  <use href="#palmTreeLaguna" x="180" y="100"/>
  <use href="#palmTreeLaguna" x="420" y="70" transform="scale(0.85)"/>
  <use href="#palmTreeLaguna" x="660" y="70"/>
  <use href="#palmTreeLaguna" x="900" y="90" transform="scale(1.1)"/>
  <use href="#palmTreeLaguna" x="1000" y="170"/>
  <use href="#palmTreeLaguna" x="1110" y="160"/>
  <use href="#palmTreeLaguna" x="1130" y="420" transform="scale(1.1)"/>
  <use href="#palmTreeLaguna" x="1060" y="520"/>
  <use href="#palmTreeLaguna" x="880" y="620" transform="scale(0.9)"/>
  <use href="#palmTreeLaguna" x="650" y="680"/>
  <use href="#palmTreeLaguna" x="270" y="660"/>
  <use href="#palmTreeLaguna" x="70" y="440" transform="scale(1.2)"/>
  <use href="#palmTreeLaguna" x="60" y="320"/>

  <!-- ==================== ROTULACIÓN Y BRÚJULA ==================== -->
  <g transform="translate(60, 60)" filter="url(#shadowFilterLaguna)">
    <circle cx="0" cy="0" r="26" fill="#0F172A" stroke="#D4AF37" stroke-width="2"/>
    <polygon points="0,-18 4,0 -4,0" fill="#EF4444"/>
    <polygon points="0,18 4,0 -4,0" fill="#CBD5E1"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">N</text>
  </g>

  <!-- Banner Oficial Superior -->
  <g transform="translate(600, 32)" filter="url(#shadowFilterLaguna)">
    <rect x="-230" y="-18" width="460" height="36" rx="18" fill="#152A50" stroke="#D4AF37" stroke-width="2"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      SUNSOL ECOLAND &bull; ÁREA LAGUNA &amp; MANGLAR
    </text>
  </g>
</svg>
